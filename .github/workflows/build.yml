name: Build DSH GPT module

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, 'feat/**', 'refactor/**' ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Run JVM unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Verify LSPosed module metadata
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -F 'META-INF/xposed/java_init.list'
          unzip -l "$APK" | grep -F 'META-INF/xposed/module.prop'
          unzip -l "$APK" | grep -F 'META-INF/xposed/scope.list'
          unzip -p "$APK" 'META-INF/xposed/java_init.list' | grep -Fx 'com.gpt.hook.MainModule'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-gpt-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

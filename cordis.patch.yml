# Example bundle patch for a local DSH-GPT development checkout.
# Adapt the target layer/row to the DSH version and profile being used.
- insert:
    - id: dsh-gpt-runtime
      name: '@dsh-external/dsh-gpt-runtime'
      config:
        enabled: true
        profileName: 'DSH-GPT Default'
        language: 'zh-CN'
        verbosity: 'balanced'
        executionPolicy: 'confirm-sensitive-actions'
        promptProfile: '你是一个严谨、透明的任务执行助手。先理解目标与约束，再给出可验证的步骤；调用工具前说明目的，调用后核对结果。区分已完成、进行中、失败和未验证事项。'

# Example DSH Profile composition.
# dsh-skill supplies ctx.skills; dsh-tool-skill exposes the catalog and model-facing skill loader.
# dsh-skill-filesystem is intentionally not inserted here; add it separately when local skill discovery is needed.
- insert:
    - id: dsh-skill
      name: '@deepseek-ai/dsh-skill'
    - id: dsh-tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
    - id: dsh-gpt-runtime
      name: '@dsh-external/dsh-gpt-runtime'
      config:
        enabled: true
        skillsEnabled: true
        profileName: 'DSH-GPT 默认配置'
        language: 'zh-CN'
        verbosity: 'balanced'
        executionPolicy: 'confirm-sensitive-actions'
        promptProfile: '你是一个严谨、透明的任务执行助手。先理解目标与约束，再给出可验证的步骤；调用工具前说明目的，调用后核对结果。区分已完成、进行中、失败和未验证事项。'

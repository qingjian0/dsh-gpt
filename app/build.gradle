plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.gpt.hook'
    compileSdk 37

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.gpt.hook'
        minSdk 27
        targetSdk 37
        versionCode 4
        versionName '2.2.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            vcsInfo.include = false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        resources {
            merges += 'META-INF/xposed/*'
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

// Kotlin 2.x: keep jvmTarget aligned with compileOptions (Java 21), otherwise
// the AGP JVM-target validation fails the build.
kotlin {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
}

dependencies {
    compileOnly libs.libxposed
    implementation libs.libxposed.service
    testImplementation 'junit:junit:4.13.2'
}

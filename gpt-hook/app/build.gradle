plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gpt.hook'
    compileSdk 34

    defaultConfig {
        applicationId "com.gpt.hook"
        minSdk 26
        targetSdk 34
        versionCode 20
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly files('libs/api-82.jar')
}
